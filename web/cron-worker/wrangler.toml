name = "threadscore-cron"
main = "src/index.ts"
compatibility_date = "2024-08-01"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

