name = "threadscore"
compatibility_date = "2024-08-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "threadscore-db"
database_id = "3ff88902-75a3-407b-8bd1-0f00f6e2908d"

[[kv_namespaces]]
binding = "KV"
id = "43e8d8ed36f941f6b8a18ecb205db0e4"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

